name: End-to-end tests on staging

permissions:
  contents: read

on:
  schedule:
    # Every night at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-tests-staging
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # WEBAPP_BASE_URL is a variable of the staging environment.
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('apps/e2e-tests/package.json') }}

      - name: Install Playwright Browsers
        run: pnpm --filter e2e-tests exec playwright install --with-deps chromium

      # Retries and workers keep the CI defaults of playwright.config.ts (CI is set).
      - name: Run Playwright tests
        run: pnpm --filter e2e-tests test:headless
        env:
          E2E_TARGET_ENV: production-like
          BASE_URL: ${{ vars.WEBAPP_BASE_URL }}
          E2E_TESTMAIL_API_KEY: ${{ secrets.E2E_TESTMAIL_API_KEY }}
          E2E_TESTMAIL_NAMESPACE: ${{ secrets.E2E_TESTMAIL_NAMESPACE }}

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e-tests/playwright-report/
          retention-days: 7
