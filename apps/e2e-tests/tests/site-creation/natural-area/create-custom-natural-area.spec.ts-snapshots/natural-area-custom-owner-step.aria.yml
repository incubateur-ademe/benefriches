  - text: 💡
  - paragraph: Il n’est pas rare qu'un site ait plusieurs propriétaires (par exemple si elle est composée de plusieurs parcelles cadastrales ou alors si le bien immobilier est en indivision).
  - paragraph: Dans ce cas, il n’est pas attendu que la totalité des propriétaires soit renseigné, l’information utile pour Bénéfriches étant d’en désigner un (par exemple celui ayant la propriété de la plus grande parcelle), cette donnée étant utilisée pour affecter la partie des impacts correspondant à cette catégorie d’acteur.